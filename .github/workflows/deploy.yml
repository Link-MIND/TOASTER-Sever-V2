name: Deploy V2 Server

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy-ci:
    runs-on: ubuntu-22.04

    steps: 
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'corretto'
        java-version: '17'

    - name: application.yaml 생성
      run: | 
          mkdir -p ./toaster-bootstrap/src/main/resources
          echo "${{ secrets.V2_APPLICATION }}" > ./toaster-bootstrap/src/main/resources/application-secret.properties
        
    - name: 빌드
      run: |
          chmod +x gradlew
          ./gradlew build -x test
      shell: bash

    - name: docker build 가능하도록 환경 설정
      uses: docker/setup-buildx-action@v2.9.1
      
    - name: docker hub에로그인
      uses: docker/login-action@v2.2.0
      with:
        username: ${{ secrets.DOCKERHUB_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKERHUB_LOGIN_ACCESSTOKEN }}

    - name: docker image 빌드 및 푸시
      run: |
        docker build --platform linux/amd64 -t sss4920/toaster-multimodule .
        docker push sss4920/toaster-multimodule

  deploy-cd:      
    needs: deploy-ci
    runs-on: ubuntu-22.04

    steps:    
    - name: 도커 컨테이너 실행
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.RELEASE_V2_SERVER_IP }}
        username: ${{ secrets.RELEASE_V2_SERVER_USER }}
        key: ${{ secrets.RELEASE_V2_SERVER_KEY }}
        script: |
          cd ~
          ./deploy.sh
